<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#000000" />
  
  <!-- Safe Body -->
  <rect x="22" y="20" width="56" height="53" fill="#ffffff" />
  
  <!-- Safe Feet -->
  <rect x="31" y="73" width="7.5" height="6" fill="#ffffff" />
  <rect x="61.5" y="73" width="7.5" height="6" fill="#ffffff" />
  
  <!-- Safe Door -->
  <rect x="28.5" y="26.5" width="43" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
  
  <!-- Hinges -->
  <line x1="25" y1="38" x2="32" y2="38" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="55" x2="32" y2="55" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Dial -->
  <circle cx="60" cy="46.5" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
</svg>
